[package]
name = "boot-tracker-widget"
version = "2.0.1"
description = "BootTracker 桌面小组件（Rust 实现，替代旧版 Tkinter 组件）"
authors = ["BootTracker"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minreq = "2"
chrono = { version = "0.4", features = ["serde"] }
window-vibrancy = "0.5"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
