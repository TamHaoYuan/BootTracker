name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  # ---- 前端：lint / typecheck / test / build ----
  frontend:
    name: Frontend (Vite + React + TS + AntD)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        # tsc -b 会同时校验 references（tsconfig.node.json）
        run: npx tsc -b --pretty false

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build (Vite production)
        run: npx vite build
        env:
          # CI 下不做渐进式终端输出、不写交互式 progress
          CI: 'true'

  # ---- 后端：pytest ----
  backend:
    name: Backend (pytest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests -v --tb=short -q

  # ---- 发布：tag push（v*）时构建应用 exe + Inno Setup 安装包并上传 Release ----
  release:
    name: Build Installer (tag push)
    needs: [frontend, backend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # 创建 GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-app -> target
            tauri-widget -> target

      # cloudflared.exe 被 gitignore（体积大），构建时从官方 release 下载
      - name: Download cloudflared
        shell: pwsh
        run: >
          Invoke-WebRequest
          -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          -OutFile vendor\cloudflared.exe

      # build.bat：前端构建 → Tauri 主窗口 release → Rust 小组件 release → 图标拷贝 → PyInstaller
      - name: Build app (frontend + tauri + widget + pyinstaller)
        shell: cmd
        run: scripts\build.bat

      # runner 镜像预装 Inno Setup 6；版本号取 tag（去掉 v 前缀），中文语言包来自仓库 installer-lang/
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\boot-tracker.iss "/DAppVer=$ver"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      # 只发布安装包：onedir 的 开机记录.exe 脱离 _internal/ 无法运行，单独上传无意义
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/installer_output/BootTracker-Setup-*.exe
