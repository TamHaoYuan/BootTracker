[package]
name = "boot-tracker-widget"
version = "2.1.0"
description = "BootTracker 纯原生桌面浮窗组件 (egui/eframe)"
authors = ["BootTracker"]
edition = "2021"
default-run = "boot-tracker-widget"

[dependencies]
egui = "0.29"
eframe = "0.29"
# 与主程序统一使用 Phosphor Icons（0.7.x 依赖 egui ^0.29）
egui-phosphor = "0.7.3"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = 2
lto = false
