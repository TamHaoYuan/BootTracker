<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开机时间记录</title>
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<!-- 暗色/浅色切换 -->
<button class="mode-toggle" id="modeToggle" onclick="toggleMode()" title="切换浅色模式">&#x2600;</button>

<!-- 顶部导航栏 -->
<nav class="navbar">
  <div class="navbar-brand">
    <span class="dot"></span>
    开机记录
  </div>
  <div class="navbar-actions">
    <span class="nav-time" id="navTime">&mdash;</span>
  </div>
</nav>

<!-- 主题设置按钮 -->
<button class="theme-fab" id="themeFab" onclick="toggleThemePanel()" title="主题设置">&#x1F3A8;</button>

<div class="container">

  <div class="stat-number anim-d1" id="bootCount">&mdash;</div>
  <div class="stat-label anim-d1">次开机</div>

  <div class="current-session anim-d1">
    <div class="label">本次开机时间</div>
    <div class="value" id="currentBootTime">&mdash;</div>
  </div>

  <div class="info-card anim-d2">
    <div class="info-row">
      <span class="info-label">当前状态</span>
      <span class="info-value" id="currentStatus">&mdash;</span>
    </div>
    <div class="info-row">
      <span class="info-label">已运行时长</span>
      <span class="info-value" id="runningTime">&mdash;</span>
    </div>
  </div>

  <button class="btn btn-shutdown anim-d3" id="btnShutdown" onclick="recordShutdown()">记录关机</button>

  <div class="shutdown-count anim-d4">
    已关机 <span id="shutdownCount">0</span> 次
  </div>

  <div class="export-btns anim-d5">
    <button class="btn-export" onclick="exportCSV()">&#x1F4C4; 导出 CSV</button>
    <button class="btn-export" onclick="exportJSON()">&#x1F4CB; 导出 JSON</button>
    <button class="btn-export" onclick="exportXLSX()">&#x1F4CA; 导出 XLSX</button>
  </div>

  <!-- 主界面记录表格 -->
  <div class="records-section anim-d6">
    <div class="section-header">
      <h3>&#x1F4CB; 开机记录</h3>
      <div class="filter-bar">
        <label>从 <input type="date" id="filterFrom" onchange="refreshMainTable()"></label>
        <label>至 <input type="date" id="filterTo" onchange="refreshMainTable()"></label>
        <button class="btn-sm" onclick="clearFilter()" style="margin-left:6px;">清除筛选</button>
      </div>
    </div>
    <div class="records-table-wrap">
      <table class="records-table">
        <thead>
          <tr>
            <th>#</th>
            <th>开机时间</th>
            <th>关机时间</th>
            <th>会话时长</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="mainRecordsBody"></tbody>
      </table>
      <div class="records-empty" id="mainEmptyMsg">暂无记录</div>
    </div>
  </div>

  <!-- 图表统计区域 -->
  <div class="chart-section" style="animation: fadeInUp 0.6s 0.9s ease both;">
    <div class="section-header">
      <h3>&#x1F4CA; 开机时长趋势</h3>
      <div class="chart-tabs">
        <button class="chart-tab" onclick="switchChart('bar')">柱状图</button>
        <button class="chart-tab active" onclick="switchChart('line')">折线图</button>
      </div>
    </div>
    <div class="chart-container" id="chartWrapper">
      <svg id="chartSVG" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;"></svg>
    </div>
  </div>
</div>

  <!-- 热度图区域 -->
  <div class="heatmap-section" style="animation: fadeInUp 0.6s 1s ease both;">
    <div class="section-header">
      <h3>&#x1F525; 开机热度图</h3>
      <div class="heatmap-legend">
        <span class="hm-label">少</span>
        <span class="hm-cell" style="background:rgba(30,41,59,0.5);"></span>
        <span class="hm-cell" style="background:rgba(88,28,135,0.7);"></span>
        <span class="hm-cell" style="background:rgba(124,58,237,0.75);"></span>
        <span class="hm-cell" style="background:rgba(139,92,246,0.85);"></span>
        <span class="hm-cell" style="background:rgba(167,139,250,0.95);"></span>
        <span class="hm-label">多</span>
      </div>
    </div>
    <div class="heatmap-container" id="heatmapContainer"></div>
  </div>

</div>

<!-- Theme Panel -->
<div class="theme-overlay" id="themeOverlay">
  <div class="theme-panel">
    <div class="theme-panel-header">
      <h2>&#x1F3A8; 主题设置</h2>
      <button class="btn-close" onclick="toggleThemePanel()">&#x2715;</button>
    </div>
    <div class="theme-mode-row">
      <button class="btn-sm" id="themeModeDark" onclick="setMode('dark')">&#x263E; 暗色</button>
      <button class="btn-sm" id="themeModeLight" onclick="setMode('light')">&#x2600; 浅色</button>
    </div>
    <div class="theme-grid">
      <div class="theme-card" data-theme="purple" onclick="pickTheme('purple')">
        <div class="theme-preview" style="background:linear-gradient(135deg,#0a0c14,#1e1b4b);">
          <div class="tp-accent" style="background:linear-gradient(135deg,#8b5cf6,#d946ef);"></div>
          <div class="tp-bar" style="background:rgba(139,92,246,0.25);"></div>
          <div class="tp-bar short" style="background:rgba(139,92,246,0.15);"></div>
          <div class="tp-bar" style="background:rgba(139,92,246,0.1);"></div>
        </div>
        <div class="theme-card-label">紫色</div>
        <div class="theme-card-check"></div>
      </div>
      <div class="theme-card" data-theme="blue" onclick="pickTheme('blue')">
        <div class="theme-preview" style="background:linear-gradient(135deg,#0a0c14,#0c1929);">
          <div class="tp-accent" style="background:linear-gradient(135deg,#3b82f6,#06b6d4);"></div>
          <div class="tp-bar" style="background:rgba(59,130,246,0.25);"></div>
          <div class="tp-bar short" style="background:rgba(59,130,246,0.15);"></div>
          <div class="tp-bar" style="background:rgba(59,130,246,0.1);"></div>
        </div>
        <div class="theme-card-label">蓝色</div>
        <div class="theme-card-check"></div>
      </div>
      <div class="theme-card" data-theme="green" onclick="pickTheme('green')">
        <div class="theme-preview" style="background:linear-gradient(135deg,#0a0c14,#022c22);">
          <div class="tp-accent" style="background:linear-gradient(135deg,#10b981,#34d399);"></div>
          <div class="tp-bar" style="background:rgba(16,185,129,0.25);"></div>
          <div class="tp-bar short" style="background:rgba(16,185,129,0.15);"></div>
          <div class="tp-bar" style="background:rgba(16,185,129,0.1);"></div>
        </div>
        <div class="theme-card-label">绿色</div>
        <div class="theme-card-check"></div>
      </div>
      <div class="theme-card" data-theme="orange" onclick="pickTheme('orange')">
        <div class="theme-preview" style="background:linear-gradient(135deg,#0a0c14,#1c1008);">
          <div class="tp-accent" style="background:linear-gradient(135deg,#f97316,#f59e0b);"></div>
          <div class="tp-bar" style="background:rgba(249,115,22,0.25);"></div>
          <div class="tp-bar short" style="background:rgba(249,115,22,0.15);"></div>
          <div class="tp-bar" style="background:rgba(249,115,22,0.1);"></div>
        </div>
        <div class="theme-card-label">橙色</div>
        <div class="theme-card-check"></div>
      </div>
      <div class="theme-card" data-theme="gray" onclick="pickTheme('gray')">
        <div class="theme-preview" style="background:linear-gradient(135deg,#0a0c14,#111827);">
          <div class="tp-accent" style="background:linear-gradient(135deg,#64748b,#94a3b8);"></div>
          <div class="tp-bar" style="background:rgba(100,116,139,0.25);"></div>
          <div class="tp-bar short" style="background:rgba(100,116,139,0.15);"></div>
          <div class="tp-bar" style="background:rgba(100,116,139,0.1);"></div>
        </div>
        <div class="theme-card-label">灰色</div>
        <div class="theme-card-check"></div>
      </div>
      <div class="theme-card" data-theme="mica" onclick="pickTheme('mica')">
        <div class="theme-preview" style="background:#1a1a1a;">
          <div class="tp-accent" style="background:linear-gradient(135deg,#64748b,#e2e8f0);"></div>
          <div class="tp-bar" style="background:rgba(255,255,255,0.06);"></div>
          <div class="tp-bar short" style="background:rgba(255,255,255,0.04);"></div>
          <div class="tp-bar" style="background:rgba(255,255,255,0.03);"></div>
        </div>
        <div class="theme-card-label">云母</div>
        <div class="theme-card-check"></div>
      </div>
      <div class="theme-card" data-theme="material-you" onclick="pickTheme('material-you')">
        <div class="theme-preview" style="background:linear-gradient(135deg,#141218,#1d192b);">
          <div class="tp-accent" style="background:linear-gradient(135deg,#6750a4,#d0bcff);"></div>
          <div class="tp-bar" style="background:rgba(208,188,255,0.15);"></div>
          <div class="tp-bar short" style="background:rgba(208,188,255,0.1);"></div>
          <div class="tp-bar" style="background:rgba(208,188,255,0.06);"></div>
        </div>
        <div class="theme-card-label">Material You</div>
        <div class="theme-card-check"></div>
      </div>
    </div>
  </div>
</div>

<!-- Admin Overlay -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <div class="admin-header">
      <h2>&#x2699; 管理员面板</h2>
      <button class="btn-close" onclick="toggleAdmin()">&#x2715;</button>
    </div>

    <!-- 标签页导航 -->
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchAdminTab('records', this)">&#x1F4CB; 记录管理</button>
      <button class="admin-tab" onclick="switchAdminTab('trash', this)">&#x1F5D1; 回收站</button>
      <button class="admin-tab" onclick="switchAdminTab('add', this)">&#x2795; 添加记录</button>
    </div>

    <!-- 统计卡片（所有标签页共享） -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="num" id="statBoots">0</div>
        <div class="lbl">总开机次数</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statShutdowns">0</div>
        <div class="lbl">总关机次数</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statActive">0</div>
        <div class="lbl">进行中会话</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statAvg">&mdash;</div>
        <div class="lbl">平均会话时长</div>
      </div>
    </div>

    <!-- 标签页：记录管理 -->
    <div class="admin-tab-content active" id="tabRecords">
      <div class="admin-actions">
        <button class="btn-sm success" onclick="exportCSV()">&#x1F4E5; 导出 CSV</button>
        <button class="btn-sm danger" onclick="clearAll()">&#x1F5D1; 清空全部</button>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>开机时间</th>
              <th>关机时间</th>
              <th>会话时长</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="adminRecordsBody"></tbody>
        </table>
        <div class="admin-empty" id="adminEmptyMsg">暂无记录</div>
      </div>
    </div>

    <!-- 标签页：回收站 -->
    <div class="admin-tab-content" id="tabTrash">
      <div class="admin-actions">
        <button class="btn-sm danger" onclick="clearTrash()">&#x1F5D1; 清空回收站</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>开机时间</th>
              <th>关机时间</th>
              <th>会话时长</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="trashRecordsBody"></tbody>
        </table>
        <div class="admin-empty" id="trashEmptyMsg">回收站为空</div>
      </div>
    </div>

    <!-- 标签页：添加记录 -->
    <div class="admin-tab-content" id="tabAdd">
      <div class="add-form">
        <div class="form-group">
          <label>开机时间 <span class="form-required">*</span></label>
          <input type="datetime-local" id="addBootTime" class="form-input">
        </div>
        <div class="form-group">
          <label>关机时间 <span class="form-hint">（可选，留空表示未关机）</span></label>
          <input type="datetime-local" id="addShutdownTime" class="form-input">
        </div>
        <div class="form-actions">
          <button class="btn-sm success" onclick="addRecord()">&#x2714; 添加记录</button>
        </div>
        <div class="form-msg" id="addFormMsg"></div>
      </div>
    </div>
  </div>
</div>

<script src="lib/xlsx.full.min.js"></script>
<script src="static/js/app.js"></script>
</body>
</html>
